[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-x"
version = "0.1.0"
description = "A local-first research platform for studying reliable, verifiable, secure multi-step AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5,<3",
  "argon2-cffi>=23.1,<25",
  "streamlit>=1.35,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
atlas-x = "atlas.cli:main"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

# The two packages whose public names are re-exported lazily through
# `__getattr__` cannot satisfy F401 the usual way. Their `TYPE_CHECKING` blocks
# are the type-checking contract for names that are resolved at runtime, so
# ruff sees names that appear to be imported and never used. The mapping inside
# each module is what actually guarantees the export, and a name in one block
# but not in the other is a missing export rather than a lint nit; it is caught
# by the tests that import every name in `__all__` from a cold interpreter.
[tool.ruff.lint.per-file-ignores]
"atlas/sandbox/__init__.py" = ["F401"]
"atlas/tools/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["argon2.*"]
ignore_missing_imports = true

# The sandbox's guest-side modules run only inside the Linux WSL guest, but the
# host toolchain type-checks them on Windows, where `os.fork`, `os.geteuid`,
# `os.killpg`, and `os.chown` are absent from the standard-library stubs. Only
# `attr-defined` is relaxed, and only for these modules: every other check stays
# on, and a genuine typo in a POSIX call would still be reported by ruff (which
# lints for undefined names) and by a Linux run of the conformance harness.
[[tool.mypy.overrides]]
module = [
  "atlas.sandbox.cgroups",
  "atlas.sandbox.guest.launcher",
  "atlas.sandbox.guest.selftest",
  "atlas.sandbox.guest.worker",
]
disable_error_code = ["attr-defined"]